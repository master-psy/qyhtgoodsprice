<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秋雨海棠 | 数字化订货单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --brand-gold: #c5a059; --dark-bg: #0f1115; --card-bg: #1a1d23; }
        body { font-family: 'Inter', 'Noto Serif SC', serif; background-color: var(--dark-bg); color: #e5e7eb; overflow-x: hidden; }
        .gold-text { color: var(--brand-gold); }
        .gold-bg { background-color: var(--brand-gold); }
        .product-card { transition: all 0.3s ease; border: 1px solid #2d2d2d; }
        .product-card:hover { border-color: var(--brand-gold); background: #22262d; }
        
        /* 侧边栏动画 */
        #cart-drawer { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        #cart-drawer.open { transform: translateX(0); }
        .drawer-overlay { transition: opacity 0.3s ease; opacity: 0; pointer-events: none; }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="antialiased pb-32">

    <header class="sticky top-0 z-40 py-6 px-8 flex justify-between items-center bg-[#0f1115]/90 backdrop-blur-md border-b border-gray-800">
        <div>
            <h1 class="text-2xl font-bold tracking-[0.2em] gold-text uppercase">秋雨海棠</h1>
            <p class="text-[10px] text-gray-500 tracking-widest mt-1">ESTHER BEGONIACEAE • PRODUCT LIST</p>
        </div>
        <div class="flex items-center space-x-6">
            <div class="hidden md:flex items-center bg-gray-900 px-3 py-1.5 rounded-full border border-gray-700">
                <span class="text-xs text-gray-500 mr-2">折扣</span>
                <select id="discount-select" onchange="calculateTotal()" class="bg-transparent text-sm font-bold text-white border-none focus:ring-0 cursor-pointer">
                    <option value="1">100% (原价)</option>
                    <option value="0.9">90% (9折)</option>
                    <option value="0.8">80% (8折)</option>
                    <option value="0.5">50% (半价)</option>
                </select>
            </div>
            <button onclick="toggleDrawer()" class="relative p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="List" />
                    <path d="M4 6h16M4 12h16M4 18h7" />
                </svg>
                <span id="cart-dot" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[10px] flex items-center justify-center hidden">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12" id="product-container"></main>

    <div class="fixed bottom-0 left-0 right-0 z-30 p-4 bg-gradient-to-t from-black to-transparent">
        <div class="max-w-5xl mx-auto bg-[#1a1d23]/95 backdrop-blur-xl border border-gray-700 p-6 rounded-3xl shadow-2xl flex flex-wrap items-center justify-between">
            <div class="cursor-pointer" onclick="toggleDrawer()">
                <p class="text-xs text-gray-500 uppercase tracking-widest mb-1 italic">点击查看已选清单 ↑</p>
                <div class="flex items-baseline space-x-2">
                    <span class="text-3xl font-bold gold-text tracking-tighter">¥<span id="final-price">0</span></span>
                    <span class="text-sm text-gray-500 line-through">¥<span id="raw-price">0</span></span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div id="save-banner" class="hidden px-3 py-1 bg-yellow-900/20 border border-yellow-700/50 rounded-lg text-xs gold-text">
                    已省 ¥<span id="save-value">0</span>
                </div>
                <button onclick="toggleDrawer()" class="gold-bg text-black font-bold px-8 py-3 rounded-xl hover:brightness-110 transition-all">
                    确认下单
                </button>
            </div>
        </div>
    </div>

    <div id="drawer-overlay" onclick="toggleDrawer()" class="drawer-overlay fixed inset-0 bg-black/60 z-[60]"></div>
    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-[#16191e] z-[70] shadow-2xl flex flex-col border-l border-gray-800">
        <div class="p-6 border-b border-gray-800 flex justify-between items-center">
            <h2 class="text-xl font-bold tracking-wider">已选明细</h2>
            <button onclick="toggleDrawer()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
        </div>
        
        <div id="cart-list" class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="text-center py-20 text-gray-600">
                <p>清单空空如也</p>
            </div>
        </div>

        <div class="p-6 bg-black/40 border-t border-gray-800">
            <div class="flex justify-between mb-4">
                <span class="text-gray-400">商品件数</span>
                <span id="drawer-count" class="font-bold">0 件</span>
            </div>
            <div class="flex justify-between mb-6">
                <span class="text-gray-400">应付总额</span>
                <span class="text-2xl font-bold gold-text">¥<span id="drawer-price">0</span></span>
            </div>
            <button class="w-full gold-bg text-black font-bold py-4 rounded-xl shadow-lg">提交保存</button>
        </div>
    </div>

    <script>
        // 商品数据
        const products = [
            { category: "臻颜系列", items: [
                { id: 1, name: "臻颜精粹水", price: 258 }, { id: 2, name: "臻颜眼霜", price: 498 },
                { id: 4, name: "臻颜精华液", price: 698 }, { id: 8, name: "臻颜一套 (五件)", price: 2350 }
            ]},
            { category: "高级护理", items: [
                { id: 27, name: "皙颜", price: 11800 }, { id: 30, name: "宛若", price: 6800 },
                { id: 33, name: "臀疗", price: 9800 }, { id: 18, name: "平衡霜", price: 29800 }
            ]},
            { category: "口服调理", items: [
                { id: 19, name: "清幽肽", price: 699 }, { id: 25, name: "活力源", price: 3980 },
                { id: 26, name: "黑珍肽", price: 880 }
            ]}
        ];

        let cart = {};

        function init() {
            const container = document.getElementById('product-container');
            products.forEach(cat => {
                const html = `
                    <div class="mb-12">
                        <h2 class="text-lg font-bold gold-text mb-6 flex items-center tracking-widest">
                            <span class="w-8 h-[1px] bg-yellow-600/50 mr-3"></span>${cat.category}
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${cat.items.map(p => `
                                <div class="product-card rounded-2xl p-5 flex justify-between items-center bg-[#1a1d23]">
                                    <div>
                                        <h4 class="font-medium">${p.name}</h4>
                                        <p class="text-sm text-gray-500 mt-1">¥${p.price.toLocaleString()}</p>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <button onclick="updateQty(${p.id}, -1, '${p.name}', ${p.price})" class="w-8 h-8 rounded-lg bg-gray-800 flex items-center justify-center">-</button>
                                        <span id="qty-${p.id}" class="w-4 text-center text-sm font-bold">0</span>
                                        <button onclick="updateQty(${p.id}, 1, '${p.name}', ${p.price})" class="w-8 h-8 rounded-lg gold-bg text-black flex items-center justify-center font-bold">+</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function updateQty(id, change, name, price) {
            if (!cart[id]) cart[id] = { name: name, qty: 0, price: price };
            cart[id].qty = Math.max(0, cart[id].qty + change);
            if (cart[id].qty === 0) delete cart[id];
            
            // 更新页面上所有该商品的显示数量
            const qtyEls = document.querySelectorAll(`[id="qty-${id}"]`);
            qtyEls.forEach(el => el.innerText = cart[id] ? cart[id].qty : 0);
            
            calculateTotal();
            renderCartList();
        }

        function calculateTotal() {
            let raw = 0;
            let count = 0;
            const discount = parseFloat(document.getElementById('discount-select').value);

            for (let id in cart) {
                raw += cart[id].qty * cart[id].price;
                count += cart[id].qty;
            }

            const final = Math.round(raw * discount);
            
            document.getElementById('raw-price').innerText = raw.toLocaleString();
            document.getElementById('final-price').innerText = final.toLocaleString();
            document.getElementById('drawer-price').innerText = final.toLocaleString();
            document.getElementById('drawer-count').innerText = `${count} 件`;
            
            // 提示立省
            const saveBanner = document.getElementById('save-banner');
            const saveVal = document.getElementById('save-value');
            if (raw > final) {
                saveBanner.classList.remove('hidden');
                saveVal.innerText = (raw - final).toLocaleString();
            } else {
                saveBanner.classList.add('hidden');
            }

            // 顶部小红点
            const dot = document.getElementById('cart-dot');
            dot.innerText = count;
            count > 0 ? dot.classList.remove('hidden') : dot.classList.add('hidden');
        }

        function renderCartList() {
            const listContainer = document.getElementById('cart-list');
            const keys = Object.keys(cart);
            
            if (keys.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-20 text-gray-600"><p>尚未选择任何商品</p></div>';
                return;
            }

            listContainer.innerHTML = keys.map(id => {
                const item = cart[id];
                return `
                    <div class="flex justify-between items-center bg-black/20 p-4 rounded-xl border border-gray-800">
                        <div>
                            <p class="font-bold text-sm text-gray-100">${item.name}</p>
                            <p class="text-xs gold-text mt-1">¥${item.price} × ${item.qty}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="updateQty(${id}, -1, '${item.name}', ${item.price})" class="w-6 h-6 rounded bg-gray-700 text-xs">-</button>
                            <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                            <button onclick="updateQty(${id}, 1, '${item.name}', ${item.price})" class="w-6 h-6 rounded gold-bg text-black text-xs">+</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleDrawer() {
            document.getElementById('cart-drawer').classList.toggle('open');
            document.getElementById('drawer-overlay').classList.toggle('open');
        }

        window.onload = init;
    </script>
</body>
</html>
